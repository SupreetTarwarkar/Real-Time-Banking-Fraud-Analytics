name: Import approved portfolio binary assets

on:
  push:
    branches: [main]
    paths:
      - 'Banking_Fraud_GitHub_Remaining_Assets.zip'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract only the approved project assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('Banking_Fraud_GitHub_Remaining_Assets.zip')
          if not archive.is_file():
              print('Archive already removed; no import needed.')
              raise SystemExit(0)
          allowed = {
              'docs/Final_BRD.docx',
              'reports/Banking_Fraud_Risk_Analytics.pbix',
              'screenshots/fabric/01_Fabric_Workspace_Architecture.png',
              'screenshots/fabric/02_Eventstream_Architecture.png',
              'screenshots/fabric/03_Live_Fraud_Pipeline.png',
              'screenshots/fabric/04_RealTime_Fraud_Monitoring_Dashboard.png',
              'screenshots/power-bi/01_Fraud_Overview_Jul-Sep_2026.png',
              'screenshots/power-bi/02_Fraud_Investigation_Jul-Sep_2026.png',
              'screenshots/power-bi/03_Risk_Patterns_Jul-Sep_2026.png',
              'screenshots/power-bi/04_Fraud_Overview_Jul-Nov_2026.png',
              'screenshots/power-bi/05_Fraud_Investigation_Jul-Nov_2026.png',
              'screenshots/power-bi/06_Risk_Patterns_Jul-Nov_2026.png',
          }
          if archive.stat().st_size > 10_000_000:
              raise ValueError('Archive too large')
          with ZipFile(archive) as z:
              names = set(z.namelist())
              if names != allowed:
                  raise ValueError(f'Unexpected asset paths: {sorted(names ^ allowed)}')
              if sum(i.file_size for i in z.infolist()) > 12_000_000:
                  raise ValueError('Uncompressed assets exceed safety limit')
              for name in sorted(allowed):
                  dest = Path(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(name))
          # Activate the portfolio's screenshot previews after the binary files exist.
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'The formatted DOCX, PBIX and 10 project screenshots are supplied in the companion archive for repository upload.',
              'The [formatted BRD](docs/Final_BRD.docx), [Power BI report](reports/Banking_Fraud_Risk_Analytics.pbix) and [10 project screenshots](screenshots/power-bi/) are now included in this repository.'
          )
          gallery = """## Project screenshots

          ### Power BI: historical reporting

          | Fraud Overview | Fraud Investigation | Risk Patterns |
          |---|---|---|
          | ![Fraud Overview](screenshots/power-bi/01_Fraud_Overview_Jul-Sep_2026.png) | ![Fraud Investigation](screenshots/power-bi/02_Fraud_Investigation_Jul-Sep_2026.png) | ![Risk Patterns](screenshots/power-bi/03_Risk_Patterns_Jul-Sep_2026.png) |

          ### Fabric: rolling-hour monitoring

          ![Real-Time Fraud Monitoring Dashboard](screenshots/fabric/04_RealTime_Fraud_Monitoring_Dashboard.png)

          Additional evidence: [Eventstream](screenshots/fabric/02_Eventstream_Architecture.png) · [Pipeline](screenshots/fabric/03_Live_Fraud_Pipeline.png) · [Later-state report screenshots](screenshots/power-bi/).

          """
          gallery = '\n'.join(line.strip() for line in gallery.splitlines()) + '\n'
          if '## Project screenshots' not in readme:
              readme = readme.replace('## Acknowledgments', gallery + '## Acknowledgments')
          readme_path.write_text(readme, encoding='utf-8')
          docs_path = Path('docs/README.md')
          docs = docs_path.read_text(encoding='utf-8')
          docs = docs.replace('**Final_BRD.docx** — professionally formatted three-page Word version included in the companion project archive for upload.', '[**Final_BRD.docx**](Final_BRD.docx) — professionally formatted three-page Word version.')
          docs_path.write_text(docs, encoding='utf-8')
          for note in ('reports/README.md', 'screenshots/power-bi/README.md', 'screenshots/fabric/README.md'):
              p = Path(note)
              content = p.read_text(encoding='utf-8')
              content = content.replace('is included in the companion asset package and is awaiting binary upload to this folder.', 'is included in this repository.')
              content = content.replace('The companion asset package includes', 'This folder includes')
              p.write_text(content, encoding='utf-8')
          print(f'Extracted {len(allowed)} approved binary assets and updated documentation.')
          PY

      - name: Commit assets and remove upload ZIP
        shell: bash
        run: |
          if [ ! -f Banking_Fraud_GitHub_Remaining_Assets.zip ]; then
            echo 'No archive to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.md docs/Final_BRD.docx reports/README.md reports/Banking_Fraud_Risk_Analytics.pbix screenshots/fabric/ screenshots/power-bi/
          git rm -q Banking_Fraud_GitHub_Remaining_Assets.zip
          git commit -m "assets: publish BRD, PBIX and verified dashboard screenshots"
          git push origin HEAD:main
