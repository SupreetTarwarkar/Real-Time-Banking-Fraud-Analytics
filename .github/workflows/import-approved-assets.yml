name: Import approved portfolio binary assets

on:
  push:
    branches: [main]
    paths:
      - 'Banking_Fraud_GitHub_Remaining_Assets.zip'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract only the approved project assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('Banking_Fraud_GitHub_Remaining_Assets.zip')
          if not archive.is_file():
              print('Archive already removed; no import needed.')
              raise SystemExit(0)
          allowed = {
              'docs/Final_BRD.docx',
              'reports/Banking_Fraud_Risk_Analytics.pbix',
              'screenshots/fabric/01_Fabric_Workspace_Architecture.png',
              'screenshots/fabric/02_Eventstream_Architecture.png',
              'screenshots/fabric/03_Live_Fraud_Pipeline.png',
              'screenshots/fabric/04_RealTime_Fraud_Monitoring_Dashboard.png',
              'screenshots/power-bi/01_Fraud_Overview_Jul-Sep_2026.png',
              'screenshots/power-bi/02_Fraud_Investigation_Jul-Sep_2026.png',
              'screenshots/power-bi/03_Risk_Patterns_Jul-Sep_2026.png',
              'screenshots/power-bi/04_Fraud_Overview_Jul-Nov_2026.png',
              'screenshots/power-bi/05_Fraud_Investigation_Jul-Nov_2026.png',
              'screenshots/power-bi/06_Risk_Patterns_Jul-Nov_2026.png',
          }
          if archive.stat().st_size > 10_000_000:
              raise ValueError('Archive too large')
          with ZipFile(archive) as z:
              names = set(z.namelist())
              if names != allowed:
                  raise ValueError(f'Unexpected asset paths: {sorted(names ^ allowed)}')
              if sum(i.file_size for i in z.infolist()) > 12_000_000:
                  raise ValueError('Uncompressed assets exceed safety limit')
              for name in sorted(allowed):
                  dest = Path(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(name))
          print(f'Extracted {len(allowed)} approved binary assets.')
          PY

      - name: Commit assets and remove upload ZIP
        shell: bash
        run: |
          if [ ! -f Banking_Fraud_GitHub_Remaining_Assets.zip ]; then
            echo 'No archive to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Final_BRD.docx reports/Banking_Fraud_Risk_Analytics.pbix screenshots/fabric/ screenshots/power-bi/
          git rm -q Banking_Fraud_GitHub_Remaining_Assets.zip
          git commit -m "assets: publish BRD, PBIX and verified dashboard screenshots"
          git push origin HEAD:main
